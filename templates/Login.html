{% extends 'base.html' %}

{% block content %}
    <h2>Log in</h2>

    <div class="card">
        <form method="post">
            {% csrf_token %}
            {{ form.as_p }}
            <input type="hidden" name="next" value="{{ next }}">
            <div class="row" style="margin-top: 12px;">
                <button class="btn" type="submit">Log in</button>
                <a class="btn btn-secondary" href="{% url 'pages:signup' %}">Create account</a>
            </div>
        </form>
    </div>
{% endblock %}
