{% extends 'base.html' %}

{% block content %}
    <h1>Search Preferences</h1>

    <form action="{% url 'pages:results' %}" method="get">
        <label for="sex">Gender:</label>
        <select id="sex" name="sex">
            <option value="">All</option>
            {% for value in sex_options %}<option value="{{ value }}">{{ value }}</option>{% endfor %}
        </select>
        <br><br>

        <label for="weather">Weather:</label>
        <select id="weather" name="weather">
            <option value="">All</option>
            {% for value in weather_options %}<option value="{{ value }}">{{ value }}</option>{% endfor %}
        </select>
        <br><br>

        <label for="style">Style:</label>
        <select id="style" name="style">
            <option value="">All</option>
            {% for value in style_options %}<option value="{{ value }}">{{ value }}</option>{% endfor %}
        </select>
        <br><br>

        <label for="color">Color:</label>
        <select id="color" name="color">
            <option value="">All</option>
            {% for value in color_options %}<option value="{{ value }}">{{ value }}</option>{% endfor %}
        </select>
        <br><br>

        <button class="btn" type="submit">Search</button>
    </form>
{% endblock %}
