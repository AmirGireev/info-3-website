<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Klothes App</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #d8d7d7;
            color: #111;
        }

        nav {
            background: #000000;
            padding: 12px 20px;
            position: sticky;
            top: 0;
            z-index: 10;
        }
        .nav-inner {
            max-width: 1000px;
            margin: 0 auto;
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 12px;
        }
        .brand {
            color: #f5e9ff;
            font-weight: 700;
            letter-spacing: 0.3px;
            text-decoration: none;
            padding: 6px 10px;
            border-radius: 8px;
        }
        .nav-links {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            align-items: center;
        }
        nav a {
            color: white;
            text-decoration: none;
            padding: 6px 10px;
            border-radius: 8px;
        }
        nav a:hover {
            background: #876f60;
            opacity: 1;
        }

        .nav-search {
            display: flex;
            gap: 6px;
        }
        .nav-search input {
            width: 170px;
            padding: 7px 10px;
            border-radius: 8px;
            border: none;
            font-size: 14px;
            box-sizing: border-box;
        }
        .nav-search button {
            padding: 8px 12px;
        }

        .container {
            max-width: 1000px;
            margin: 24px auto;
            background: #ffffff;
            padding: 22px;
            border-radius: 12px;
            box-shadow: 0 6px 18px rgba(0,0,0,0.06);
        }
        h1, h2, h3 { margin-top: 0; }
        .muted {
            color: #2e2828;
            font-size: 14px;
            line-height: 1.5;
        }
        .card {
            background: #e3dcdc;
            border: 1px solid #e9e9e9;
            border-radius: 12px;
            padding: 14px;
            box-shadow: 0 4px 14px rgba(0,0,0,0.04);
        }
        .grid {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 14px;
        }
        .row {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            align-items: center;
        }
        button, .btn {
            background: #876f60;
            color: #ffffff;
            border: none;
            padding: 10px 14px;
            border-radius: 10px;
            cursor: pointer;
            font-weight: 600;
            font-size: 14px;
            line-height: 1;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            text-decoration: none;
        }
        button:hover, .btn:hover { background: #2b1f19; }
        .btn-secondary { background: #111; }
        .btn-secondary:hover { background: #876f60; }
        .btn-danger { background: #876f60; }
        .btn-danger:hover { background: #2b1f19; }

        input[type="text"], input[type="password"], select, textarea {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid #edd2d2;
            border-radius: 10px;
            font-size: 14px;
            outline: none;
            box-sizing: border-box;
        }
        input[type="text"]:focus, input[type="password"]:focus, select:focus, textarea:focus {
            border-color: #2b1f19;
            box-shadow: 0 0 0 3px rgba(21, 17, 71, 0.15);
        }
        label {
            display: block;
            margin-bottom: 6px;
            font-weight: 700;
            font-size: 13px;
            color: #222;
        }

        .img {
            width: 100%;
            aspect-ratio: 4 / 5;
            border-radius: 12px;
            border: 1px solid #eee;
            object-fit: cover;
            display: block;
        }
        .avatar {
            width: 84px;
            height: 84px;
            border-radius: 999px;
            object-fit: cover;
            border: 2px solid #eee;
        }
        .divider {
            height: 1px;
            background: #eee;
            margin: 16px 0;
        }
        .tag {
            background: #111;
            color: #fff;
            font-size: 12px;
            padding: 4px 9px;
            border-radius: 999px;
        }
        .nav-inline { display: inline; margin: 0; }
        .nav-user { color: #f5e9ff; font-size: 14px; padding: 6px 4px; }
        .nav-logout { background: transparent; padding: 6px 10px; border-radius: 8px; font-weight: 400; }
        .nav-logout:hover { background: #876f60; }
        .plain-link {
            color: inherit;
            text-decoration: none;
        }
        .plain-link:hover { text-decoration: underline; }

        @media (max-width: 700px) {
            .grid { grid-template-columns: 1fr; }
            .container { margin: 14px; padding: 16px; }
        }
    </style>
</head>

<body>
    <nav>
        <div class="nav-inner">
            <a class="brand" href="{% url 'pages:landing' %}">Klothes</a>

            <div class="nav-links">
                <a href="{% url 'pages:landing' %}">Home</a>
                {% if user.is_authenticated %}
                    <a href="{% url 'pages:profile_view' %}">Profile</a>
                    <a href="{% url 'pages:wardrobe' %}">Wardrobe</a>
                {% endif %}
                <a href="{% url 'pages:search' %}">Search Outfit</a>
                <a href="{% url 'pages:profile_search' %}">Search Profile</a>
                {% if user.is_authenticated %}
                    <span class="nav-user">{{ user.username }}</span>
                    <form class="nav-inline" method="post" action="{% url 'pages:logout' %}">
                        {% csrf_token %}
                        <button class="nav-logout" type="submit">Logout</button>
                    </form>
                {% else %}
                    <a href="{% url 'pages:login' %}">Login</a>
                    <a href="{% url 'pages:signup' %}">Sign up</a>
                {% endif %}
            </div>

            <form class="nav-search" action="{% url 'pages:results' %}" method="get">
                <input type="search" name="q" placeholder="Search outfits..." value="{{ q|default:'' }}">
                <button type="submit">Go</button>
            </form>
        </div>
    </nav>

    <div class="container">
        {% block content %}
        {% endblock %}
    </div>
</body>
</html>
